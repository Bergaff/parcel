# Авто-деплой воркера (парсер + API + бот) при push в main.
#
# Требуются секреты GitHub (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN  — токен Cloudflare, шаблон «Edit Cloudflare Workers»
#   CLOUDFLARE_ACCOUNT_ID — ваш account id
#
# Секреты самого воркера (BOT_TOKEN, BOT_SECRET, ADMIN_IDS и т.д.)
# задаются ОДИН РАЗ в Cloudflare: wrangler secret put <NAME> (или в дашборде).
# Повторные деплои их не трогают.

name: Deploy Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy Cloudflare Worker
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply D1 migrations (remote)
        run: npx wrangler d1 migrations apply DB --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
