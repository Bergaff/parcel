# Конфигурация Cloudflare Workers.
# Этот файл читает и локальный `npm run dev`, и сборка на Cloudflare (Workers Builds).
#
# ID ресурсов: D1 `poputchka-db` и KV-неймспейс уже подставлены.
# Проверить/создать ресурсы можно в дашборде: Storage & Databases → D1 / KV
# (подробно — README, раздел «2. Создать ресурсы Cloudflare (D1 + KV)»).

name = "parcel"
main = "src/index.ts"
compatibility_date = "2026-09-06"

# Не затирать при деплое переменные, добавленные через дашборд
# (Workers & Pages → parcel → Settings → Variables and Secrets).
keep_vars = true

# Несекретные настройки. Секреты — BOT_TOKEN, BOT_SECRET, ADMIN_IDS,
# ADMIN_API_TOKEN — задаются через дашборд или `wrangler secret put`
# и в Git не попадают.
[vars]
AUTO_APPROVE = "0"                          # "1" — публиковать объявления без модерации
BOT_USERNAME = "parcel_transfer_bot"        # юзернейм бота без @
SITE_URL = "https://pop-utka.app"           # основной домен сайта (custom domain воркера)

# Статика раздаётся из public/, но все страницы сайта сначала идут в воркер:
# он подставляет в index.html контент (объявления на главной, карточку, meta-теги
# и JSON-LD) — иначе поисковик видит пустой <div id="list"> и не индексирует
# разделы. Файлы (css, js, картинки, шрифты) отдаёт сам биндинг ASSETS.
[assets]
directory = "./public"
not_found_handling = "404-page"
binding = "ASSETS"
# Важно: /api/* обязательно здесь. Как только в public/ появляется 404.html,
# assets-слой начинает отвечать им на любой неизвестный путь вместо воркера
# (not_found_handling = "404-page") — без этой строчки API «пропадает».
run_worker_first = [
  "/api/*",
  "/",
  "/item/*",
  "/how",
  "/bot",
  "/terms",
  "/privacy",
  "/new",
  "/admin",
  "/r/*",
  "/gorod",
  "/gorod/*",
  "/routes",
  "/itogi",
  "/sitemap.xml",
  "/sitemap-pages.xml",
  "/sitemap-routes.xml",
  "/sitemap-items.xml",
  "/og/*",
  "/og-debug/*",
  "/og-route/*",
]

# База объявлений.
[[d1_databases]]
binding = "DB"
database_name = "poputchka-db"
database_id = "b97e5a3b-19bd-4a6c-84be-749782f2e90c"
migrations_dir = "migrations"

# KV: сессии мастера /post и rate limit.
[[kv_namespaces]]
binding = "KV"
id = "b882671513e645e5a01a282569f08dee"

# Cron: раз в сутки в 00:00 МСК — просроченные заявки уходят в архив,
# архив старше 30 дней удаляется (см. archiveExpired в src/store.ts).
# Ручной запуск: POST /api/admin/archive с ключом ADMIN_API_TOKEN.
[triggers]
crons = ["0 21 * * *"]

[observability]
enabled = true
