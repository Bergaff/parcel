# Конфигурация Cloudflare Workers.
# Этот файл читает и локальный `npm run dev`, и сборка на Cloudflare (Workers Builds).
#
# ВАЖНО для сборки на Cloudflare:
#   1. `name` должен совпадать с именем проекта в дашборде (у вас «parcel»).
#   2. Ветка, которую собирает проект, должна содержать ЭТОТ файл и папку public/.
#      Код лежит на ветке arena/01a07723-parcel: укажите её в Production branch
#      проекта или смержите PR из неё в main.
#   3. Подставьте реальные ID D1 и KV ниже (создать: wrangler d1 create parcel-db,
#      wrangler kv namespace create KV), иначе deploy упадёт на биндингах.

name = "parcel"
main = "src/index.ts"
compatibility_date = "2025-09-01"

# Статика сайта. В схеме «Pages = сайт, Worker = парсер» это тоже не мешает:
# воркер дополнительно раздаёт страницу на своём домене.
[assets]
directory = "./public"
not_found_handling = "404-page"

# База объявлений. database_name = имя, которое вы задали при создании.
[[d1_databases]]
binding = "DB"
database_name = "poputchka-db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
migrations_dir = "migrations"

# KV: сессии бота, rate limit, счётчики.
[[kv_namespaces]]
binding = "KV"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

[observability]
enabled = true
